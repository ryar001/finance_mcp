[tool.uv]

[project]
name = "finance-mcp-free"
version = "0.1.4"
description = "A financial data server that enables LLMs to pull financial data."
authors = [
    { name = "Gemini", email = "gemini@google.com" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pydantic",
    "pydantic_ai",
    "sqlmodel>=0.0.17",
    "structlog>=25.5.0",
    "pyyaml>=6.0.3",
    "fastmcp",
    "yfinance>=0.2.66",
    "tabulate>=0.9.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
"Repository" = "https://github.com/ryar001/finance_mcp.git"

[project.optional-dependencies]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]
dev = [
    "ruff",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
finance-mcp = "finance_mcp.main_mcp:main"
finance-mcp-free = "finance_mcp.main_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
