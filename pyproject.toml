[tool.uv]

[project]
name = "finance-mcp-jokerssd"
version = "0.1.0"
description = "A financial data server that enables LLMs to pull financial data."
authors = [
    { name = "Gemini", email = "gemini@google.com" }
]
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "pydantic",
    "pydantic_ai",
    "sqlmodel>=0.0.17",
    "google-generativeai",
    "structlog>=25.5.0",
    "pyyaml>=6.0.3",
    "pytest-asyncio>=1.3.0",
    "google-cloud-firestore>=2.21.0",
    "fastmcp",
    "pytest>=9.0.1",
    "yfinance>=0.2.66",
    "tabulate>=0.9.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.urls]
"Homepage" = "https://github.com/google/gemini-cli"
"Bug Tracker" = "https://github.com/google/gemini-cli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "ruff",
]

[project.scripts]
finance-mcp = "finance_mcp.main_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
